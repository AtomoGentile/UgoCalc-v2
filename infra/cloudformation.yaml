AWSTemplateFormatVersion: '2010-09-09'
Description: UgoCalc v3 — Cognito, DynamoDB tables, Lambda functions, API Gateway

Parameters:
  AppName:
    Type: String
    Default: ugocalc
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, dev]
  LambdaS3Bucket:
    Type: String
    Description: S3 bucket that holds the Lambda zip packages
  LambdaS3Key:
    Type: String
    Default: ugocalc-lambda.zip
    Description: S3 key of the Lambda zip (all five handlers bundled together)
  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 Web Client ID
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 Web Client Secret

# ─────────────────────────────────────────────
# Cognito
# ─────────────────────────────────────────────
Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AppName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AppName}-auth
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: email profile openid
      AttributeMapping:
        email: email
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub ${AppName}-android
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs:
        - !Sub ugocalc://auth
      LogoutURLs:
        - !Sub ugocalc://auth
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      PreventUserExistenceErrors: ENABLED

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub ${AppName}_identities
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  # IAM roles for Identity Pool
  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-cognito-auth
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonAPIGatewayInvokeFullAccess

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

# ─────────────────────────────────────────────
# DynamoDB
# ─────────────────────────────────────────────

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ugocalc-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE

  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ugocalc-accounts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ugocalc-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  VersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ugocalc-versions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH

  InvitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ugocalc-invites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

# ─────────────────────────────────────────────
# Lambda shared execution role base + per-function roles
# ─────────────────────────────────────────────

  LambdaBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-base
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # inference + benchmark: Query on ugocalc-events with LeadingKeys
  InferenceBenchmarkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AppName}-inference-dynamo
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Query
            Resource: !GetAtt EventsTable.Arn
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys:
                  - ${cognito-identity.amazonaws.com:sub}
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt AccountsTable.Arn
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys:
                  - ${cognito-identity.amazonaws.com:sub}

  InferenceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-inference
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref InferenceBenchmarkPolicy

  BenchmarkRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-benchmark
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref InferenceBenchmarkPolicy

  # config: GetItem on ugocalc-config only
  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-config
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: config-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt ConfigTable.Arn

  # share: CRUD on ugocalc-invites + GetItem/PutItem on ugocalc-accounts
  ShareRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-share
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: share-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt InvitesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt AccountsTable.Arn

  # bias: GetItem on accounts (LeadingKeys) + Scan on events (only this role)
  BiasRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-bias
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bias-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt AccountsTable.Arn
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt EventsTable.Arn

  # version: GetItem on ugocalc-versions only (public endpoint, no auth)
  VersionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-lambda-version
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: version-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt VersionsTable.Arn

# ─────────────────────────────────────────────
# Lambda functions
# ─────────────────────────────────────────────

  VersionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-version
      Runtime: nodejs20.x
      Handler: version/index.handler
      Role: !GetAtt VersionRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          VERSIONS_TABLE: ugocalc-versions

  InferenceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-inference
      Runtime: nodejs20.x
      Handler: inference/index.handler
      Role: !GetAtt InferenceRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          EVENTS_TABLE: ugocalc-events
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          ACCOUNTS_TABLE: ugocalc-accounts

  BenchmarkLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-benchmark
      Runtime: nodejs20.x
      Handler: benchmark/index.handler
      Role: !GetAtt BenchmarkRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          EVENTS_TABLE: ugocalc-events
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          ACCOUNTS_TABLE: ugocalc-accounts

  ConfigLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-config
      Runtime: nodejs20.x
      Handler: config/index.handler
      Role: !GetAtt ConfigRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          CONFIG_TABLE: ugocalc-config
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient

  ShareLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-share
      Runtime: nodejs20.x
      Handler: share/index.handler
      Role: !GetAtt ShareRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          ACCOUNTS_TABLE: ugocalc-accounts
          INVITES_TABLE: ugocalc-invites
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          API_BASE_URL: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  BiasLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-bias
      Runtime: nodejs20.x
      Handler: bias/index.handler
      Role: !GetAtt BiasRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          EVENTS_TABLE: ugocalc-events
          ACCOUNTS_TABLE: ugocalc-accounts
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient

# ─────────────────────────────────────────────
# API Gateway (HTTP API v2 — lower cost, faster cold start)
# ─────────────────────────────────────────────

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AppName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Stage
      AutoDeploy: true

  # Integrations
  InferenceIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt InferenceLambda.Arn
      PayloadFormatVersion: '2.0'

  BenchmarkIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BenchmarkLambda.Arn
      PayloadFormatVersion: '2.0'

  ConfigIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ConfigLambda.Arn
      PayloadFormatVersion: '2.0'

  ShareIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ShareLambda.Arn
      PayloadFormatVersion: '2.0'

  BiasIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BiasLambda.Arn
      PayloadFormatVersion: '2.0'

  VersionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt VersionLambda.Arn
      PayloadFormatVersion: '2.0'

  # Routes
  InferenceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /inference
      Target: !Sub integrations/${InferenceIntegration}

  InferenceGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /inference
      Target: !Sub integrations/${InferenceIntegration}

  BenchmarkRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /benchmark
      Target: !Sub integrations/${BenchmarkIntegration}

  ConfigRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /config
      Target: !Sub integrations/${ConfigIntegration}

  ShareRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /share
      Target: !Sub integrations/${ShareIntegration}

  ShareGenerateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /share/generate
      Target: !Sub integrations/${ShareIntegration}

  ShareRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /share/request
      Target: !Sub integrations/${ShareIntegration}

  ShareStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /share/status
      Target: !Sub integrations/${ShareIntegration}

  ShareApproveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /share/approve
      Target: !Sub integrations/${ShareIntegration}

  InviteRedirectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /invite
      Target: !Sub integrations/${ShareIntegration}

  BiasRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /bias
      Target: !Sub integrations/${BiasIntegration}

  VersionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /version
      Target: !Sub integrations/${VersionIntegration}

  # Lambda permissions for API Gateway invocation
  InferenceLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InferenceLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  BenchmarkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BenchmarkLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ConfigLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConfigLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ShareLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ShareLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  VersionLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VersionLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  BiasLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BiasLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

# ─────────────────────────────────────────────
# Outputs (paste these into amplifyconfiguration.json)
# ─────────────────────────────────────────────

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint — paste into amplifyconfiguration.json > api > endpoint
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient

  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref IdentityPool

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region

  CognitoDomain:
    Description: Cognito Hosted UI domain for OAuth
    Value: !Sub https://${AppName}-auth.auth.${AWS::Region}.amazoncognito.com
